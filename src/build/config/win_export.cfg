[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
script_export_mode=2

[preset.0.options]

custom_template/debug=@TEMPLATE_PATH@
custom_template/release=@TEMPLATE_PATH@
binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=0
; The runtime is compiled with Godotium ICO resources on all build hosts.
; Keep them intact during export; no Wine/rcedit is needed.
application/modify_resources=false
application/export_angle=2
application/export_d3d12=2
codesign/enable=false
